<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интернет-магазин</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header class="header">
            <div class="header-actions">
                <button id="openAddModalBtn" class="buy-btn">+ Добавить товар</button>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Поиск товаров..." autocomplete="off">
                <button id="searchBtn">Найти</button>
            </div>
        </header>

        <div class="controls-bar">
            <div class="control-group">
                <label for="sortSelect">Сортировка:</label>
                <select id="sortSelect" class="custom-select">
                    <option value="">По умолчанию</option>
                    <option value="title-asc">По названию (A-Z)</option>
                    <option value="title-desc">По названию (Z-A)</option>
                    <option value="price-asc">Сначала дешевле</option>
                    <option value="price-desc">Сначала дороже</option>
                </select>
            </div>

            <div class="control-group">
                <label for="limitSelect">Показывать по:</label>
                <select id="limitSelect" class="custom-select">
                    <option value="10" selected>10</option>
                    <option value="20">20</option>
                    <option value="30">30</option>
                </select>
            </div>
        </div>

        <main id="products" class="products-grid"></main>

        <div class="pagination">
            <button id="prevBtn" class="buy-btn" disabled>&larr; Назад</button>
            <span id="pageInfo" class="page-info">1</span>
            <button id="nextBtn" class="buy-btn">Вперед &rarr;</button>
        </div>
    </div>

    <div id="formModal" class="modal-overlay">
        <div class="modal-box">
            <button id="closeFormModal" class="close-btn">&times;</button>
            <h3 id="modalTitle" style="margin-bottom: 20px;">Добавить товар</h3>
            
            <form id="productForm" class="modal-form">
                <input type="hidden" id="productId">

                <div class="form-group">
                    <label for="productTitle">Название</label>
                    <input type="text" id="productTitle" required autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="productPrice">Цена ($)</label>
                    <input type="number" id="productPrice" step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="productDescription">Описание</label>
                    <textarea id="productDescription" rows="3" required></textarea>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
                    <button type="submit" class="buy-btn">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
